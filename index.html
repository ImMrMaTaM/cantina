<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cantina</title>
<meta name="theme-color" content="#5b1622">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cantina">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#f6f1ea; --card:#fffdf9; --ink:#231a17; --muted:#7c6f68; --line:#e6ddd2;
  --accent:#6e1a28; --accent-ink:#fff; --accent-soft:#f3e3e1;
  --ok:#2f6b45; --ok-bg:#e3f0e6; --wait:#5b5b7a; --wait-bg:#e8e8f1; --soon:#8a5a00; --soon-bg:#f7ecd4; --late:#8b1e1e; --late-bg:#f6dede;
  --red:#7b1e2b; --white:#d9c27a; --rose:#e39aa6;
  --r:14px; --safe-b: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#17110f; --card:#221a17; --ink:#f1e8e1; --muted:#a89a91; --line:#3a2e29; --accent:#c2485b; --accent-soft:#3b1f23;
    --ok:#8fd3a5; --ok-bg:#1f3528; --wait:#b8b8dc; --wait-bg:#2a2a3a; --soon:#f0c56b; --soon-bg:#3a2f17; --late:#f29b9b; --late-bg:#3d1f1f; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{flex:1;margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{color:var(--accent);font-size:20px;width:36px;text-align:center}
.iconbtn{width:36px;height:36px;border:0;background:transparent;border-radius:10px;font-size:22px;line-height:1;cursor:pointer;color:var(--ink)}
.iconbtn:active{background:var(--line)}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
main{padding:12px 12px calc(84px + var(--safe-b));max-width:720px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tab{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border:0;background:none;color:var(--muted);font-size:11px;cursor:pointer}
.tab svg{width:24px;height:24px;fill:currentColor}
.tab.on{color:var(--accent)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-style:normal;line-height:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:center}
.stats b{display:block;font-size:24px}.stats span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.loccard{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer}
.loccard.unk{border-style:dashed;border-color:var(--soon)}
.lc-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.lc-h b{font-size:15px}.lc-h .num{font-size:22px;font-weight:700}
.lc-s{font-size:12px;color:var(--muted);margin-top:2px}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.bar.over i{background:var(--late)}
.accent{color:var(--accent);font-weight:600}
.note{color:var(--muted);font-size:14px;margin:8px 2px}
.note a{color:var(--accent)}
.sec{margin:18px 2px 6px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.muted{color:var(--muted);font-weight:500;margin-left:6px}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:16px;margin-bottom:8px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.filters select{padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:14px}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.row.flat{cursor:default;border:0;padding:0;background:none}.mcard .row.flat{cursor:pointer}
div.row.flat{background:var(--card);border:1px solid var(--line);padding:10px 12px}
.r-main{display:flex;gap:10px;align-items:flex-start;min-width:0}.r-main>div{min-width:0}
.r-main b{display:block;font-size:15px;font-weight:600}
.s{display:block;font-size:13px;color:var(--muted)}
.r-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.qty{font-size:18px;font-weight:700}
.dot{flex-shrink:0;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--red)}.dot.b{background:var(--white)}.dot.p{background:var(--rose)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:8px;white-space:nowrap}
.chip.ok{color:var(--ok);background:var(--ok-bg)}.chip.wait{color:var(--wait);background:var(--wait-bg)}.chip.soon{color:var(--soon);background:var(--soon-bg)}.chip.late{color:var(--late);background:var(--late-bg)}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.primary,.secondary,.ghost{border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;border:1px solid transparent}
.primary{background:var(--accent);color:var(--accent-ink)}
.secondary{background:var(--card);border-color:var(--line)}
.ghost{background:none;color:var(--muted)}
.sm{padding:7px 12px;font-size:14px;border-radius:10px}
button:disabled{opacity:.45}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.hero{display:flex;gap:12px}.hero h2{margin:0;font-size:21px;letter-spacing:-.01em}.hero p{margin:2px 0}
.kv>div{padding:6px 0;border-bottom:1px solid var(--line)}.kv>div:last-child{border:0}
.kv span{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kv p{margin:2px 0}
.hist{padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px}.hist b{font-size:14px}.hist.canc{opacity:.55}
details.group{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
details.group summary{display:flex;justify-content:space-between;cursor:pointer;list-style:none}
details.group .list{margin-top:8px}
.form{display:flex;flex-direction:column;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.form label.chk{flex-direction:row;color:var(--ink)}
.form input:not([type=radio]):not([type=checkbox]),.form select,.form textarea{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
fieldset.seg{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
fieldset.seg legend{font-size:13px;color:var(--muted);margin-bottom:4px}
fieldset.seg label{flex-direction:row;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:15px}
fieldset.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
fieldset.seg small{display:block;color:var(--muted);font-size:12px}
.segbtn{display:flex;gap:6px;margin-bottom:10px}.segbtn button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer}.segbtn button.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88vh;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:14px 16px calc(18px + var(--safe-b));max-width:720px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.sh-h{display:flex;justify-content:space-between;align-items:center;font-size:17px}
#toast{position:fixed;left:50%;bottom:calc(80px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;z-index:30;max-width:90vw;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}
.login{max-width:380px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 48px) 20px 40px;text-align:center}
.login .logo{font-size:44px;color:var(--accent)}.login h1{margin:4px 0 8px}
.login .form{text-align:left;margin-top:16px}
</style>
</head>
<body>
<div id="app"><p style="text-align:center;margin-top:30vh;color:#7c6f68">Caricamento…</p></div>
<script src="app.js"></script>
</body>
</html>
