name: Keepalive Supabase
# Evita la pausa del piano Free di Supabase (scatta dopo 7 giorni senza attività)
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          curl -fsS -X POST "https://ddeoswpycvlfhztjlkdj.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_zEUf50vq4WcErjmNuCev3g_Lko70Obs" \
            -H "Content-Type: application/json" -d '{}'
      - uses: actions/checkout@v4
      - name: Tieni attivo il workflow (GitHub lo sospende dopo 60 giorni senza commit)
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $((45*86400)) ]; then
            git config user.name "keepalive-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
